name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save time and reduce noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel newer-JDK jobs if another leg fails. Each JDK gives useful signal.
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25']
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

      - name: Build Javadoc
        run: mvn -B -ntp javadoc:javadoc

  coverage:
    name: Coverage (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Verify coverage floors
        run: mvn -B -ntp -Pcoverage verify

  integration:
    name: ${{ matrix.name }} Integration (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL
            profiles: integration
            test: PostgreSqlIntegrationIT,PostgreSqlTransactionOutcomeIT,PostgreSqlParameterMetadataIT,PostgreSqlNullArrayIT,PostgreSqlLockClassificationIT,PostgreSqlBatchMetadataIT,PostgreSqlExceptionPositionIT,PostgreSqlSqlStateRedactionIT,PostgreSqlFloatingPointIT,PostgreSqlLexicalIT,PostgreSqlNotificationSanitationIT,PostgreSqlTypeRecipesIT,PostgreSqlIntervalRecipesIT,PostgreSqlIntervalIT,PostgreSqlProcedureRecipesIT,PostgreSqlMappingOptionsIT,ParameterNameRedactionIT,PostgreSqlTransactionRecipesIT,PostgreSqlBulkIdRecipesIT,PostgreSqlTenantContextIT,TemporalZoneResolutionIT,PostgreSqlTemporalRoundTripIT,PostgreSqlInfinityMappingIT,LocalTemporalZoneIT,PostgreSqlStreamingIT,PostgreSqlIdleSessionTimeoutIT,PostgreSqlNotificationFragmentedFrameIT,NotificationSupervisorReleaseIT
            experimental: false
          - name: PostgreSQL metadata (New York)
            profiles: integration
            test: PostgreSqlParameterMetadataIT
            extraArgs: -Duser.timezone=America/New_York -Dtest=ParameterMetadataSafetyTests,ParameterBindingContextTests,MetadataProtectionCompletionFenceTests,PostgresParameterMetadataSnapshotTests
            experimental: false
          - name: Temporal (New York)
            profiles: integration
            test: PostgreSqlTemporalRoundTripIT,TemporalZoneResolutionIT,PostgreSqlTypeRecipesIT,PostgreSqlIntervalRecipesIT,PostgreSqlIntervalIT,PostgreSqlProcedureRecipesIT,YearMonthZoneOffsetMappingIT,PostgreSqlFloatingPointIT,DuckDbFloatingPointIT,PostgreSqlInfinityMappingIT,DuckDbTimestampRoundTripIT,DuckDbTypedMapIT,LocalTemporalZoneIT,MySqlTemporalBindingIT,SqliteTemporalOrderingIT,SqliteIntegrationIT,TemporalArrayMappingIntegrationIT,DuckDbIntervalIT,GenericIntervalIT
            extraArgs: -Duser.timezone=America/New_York -Dtest=TemporalParameterBindingTests,TemporalResultSetMappingTests,TemporalArrayMappingTests,LocalTemporalRoundTripTests,TimestampRoundTripTests,TimeRoundTripTests,PostgreSqlTemporalArrayTests,VendorLocalTimeBindingTests,MySqlSqliteTemporalBindingTests,LegacyTemporalRangeTests,TypedMapMappingTests,TemporalColumnTypeDetectionTests,TemporalZoneResolutionTests,YearMonthZoneOffsetMappingTests,FloatingPointMappingTests
            experimental: false
          - name: MySQL
            profiles: integration
            test: MySqlIntegrationIT,MySqlTemporalBindingIT,MySqlStreamingIT,MySqlLexicalIT,MySqlUuidRecipesIT
            experimental: false
          - name: SQLite
            profiles: integration
            test: SqliteIntegrationIT,SqliteLexicalIT,SqliteReadOnlyConfigurationIT,ScriptExecutionRecipesIT,MappingOptionsIT,SqliteRowIdClassificationIT,YearMonthZoneOffsetMappingIT,OptionalTargetValidationIT,SqliteTemporalOrderingIT,SqliteTimestampMigrationIT,PositionalParameterGuardIT,BooleanTextMappingIT,BeanFieldAnnotationIT,BeanPropertyNamingIT,MappingLocaleNormalizationIT,GenericIntervalIT
            experimental: false
          - name: DuckDB
            profiles: integration
            test: DuckDbIntegrationIT,DuckDbTransactionOutcomeIT,DuckDbMetricsIntegrationIT,DuckDbCommitClassificationIT,DuckDbTimestampRoundTripIT,DuckDbScalarParameterIT,DuckDbFloatingPointIT,DuckDbLexicalIT,DuckDbTypedMapIT,GenericRecordMappingIT,ScriptExecutionRecipesIT,MappingOptionsIT,BooleanTextMappingIT,LobMappingIntegrationIT,TemporalArrayMappingIntegrationIT,DuckDbIntervalIT
            experimental: false
          - name: MariaDB
            profiles: integration,it-mariadb
            test: MariaDbIntegrationIT,MariaDbSignalClassificationIT,MariaDbTemporalBindingIT,MariaDbStreamingIT,MariaDbLexicalIT,MariaDbUuidRecipesIT
            experimental: false
          - name: YugabyteDB
            profiles: integration,it-yugabyte
            test: YugabyteNotificationIT
            experimental: true
          - name: SQL Server
            profiles: integration,it-sqlserver
            test: SqlServerIntegrationIT,SqlServerTemporalCorrectnessIT,SqlServerRecipeIT,SqlServerLexicalIT
            extraArgs: -Duser.timezone=America/New_York
            experimental: true
          - name: Oracle
            profiles: integration,it-oracle
            test: OracleIntegrationIT,OracleTemporalCorrectnessIT,OracleUuidBindingIT,OracleLexicalIT,OracleMappingOptionsIT,OracleIntervalIT
            extraArgs: -Duser.timezone=America/New_York
            experimental: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Verify ${{ matrix.name }} integration profile
        env:
          ACCEPT_EULA: 'Y'
        run: mvn -B -ntp -P${{ matrix.profiles }} -Dit.test=${{ matrix.test }} ${{ matrix.extraArgs }} verify

  notification-topology:
    name: Notification Topology (PgBouncer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Verify PostgreSQL notification topology
        run: mvn -B -ntp -Pnotification-topology -Dit.test=PostgreSqlNotificationTopologyIT verify

  memory-stability:
    name: Memory Stability (JDK 21)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Run memory stability stress test
        run: mvn -B -ntp -Dpyranid.stress=true -Dtest=MemoryStabilityStressTests test
