[databases]
pyranid = host=notification-primary port=5432 dbname=pyranid user=pyranid password=pyranid

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pyranid
pool_mode = session
max_client_conn = 20
default_pool_size = 5
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
